        .sel-btn:hover { background: #2980b9; }
        .sound-btn { background: #9b59b6; color: white; border: none; padding: 12px 18px; font-size: 20px; border-radius: 8px; cursor: pointer; vertical-align: middle; margin-left: 10px; font-weight: bold; }

        { w: "die", j: "死ぬ", e: "💀", p: "ダイ (ieで『アイ』と発音するルール)" },
        { w: "alive", j: "生きている", e: "🧍", p: "アライブ (マジックE：iをアルファベット読み)" },
        { w: "strong", j: "強い", e: "💪", p: "ストロング (ongは『オング』という塊ルール)" },
        { w: "weak", j: "弱い", e: "🌱", p: "ウィーク (eaは『イー』と長く伸ばすルール)" },

        // --- ここからセット30（581〜600語目：重要語句ラストスパート！） ---
        { w: "idea", j: "考え、アイデア", e: "💡", p: "アイデア (iをアイ、eaをアと読む独特なリズム)" },
        { w: "reason", j: "理由、わけ", e: "💡", p: "リーズン (eaは『イー』、sがズと濁るルール)" },
        { w: "fact", j: "事実、本当のこと", e: "✔️", p: "ファクト (aは短いア、ctはクトの塊)" },
        { w: "piece", j: "1つ、破片・（a piece of 〜で）個", e: "🧩", p: "ピース (ieは『イー』、最後のceは『ス』)" },
        { w: "part", j: "部分、一部・役割", e: "🧩", p: "パート (arは口を大きく開けて『アー』)" },
        { w: "side", j: "側、面・横", e: "🫲", p: "サイド (マジックE：iをアルファベット読み)" },
        { w: "end", j: "終わり、結末・終わる", e: "🏁", p: "エンド (eは短い『エ』の音)" },
        { w: "top", j: "頂上、トップ・一番上", e: "🔝", p: "トップ (oは短く『オ』の音)" },
        { w: "bottom", j: "底、一番下", e: "👇", p: "ボトム (ttだけどトは1回、oは短いオ)" },
        { w: "front", j: "前面、前部・フロント", e: "◀️", p: "フロント (oだけど『ア』に近い音になる例外)" },
        { w: "back", j: "後ろ、背面・戻る", e: "🔙", p: "バック (ckで1つの『ク』の音になるルール)" },
        { w: "future", j: "未来、将来", e: "🛸", p: "フューチャー (uをユー、tureを『チャー』と読む塊)" },
        { w: "past", j: "過去・過去の", e: "⏳", p: "パスト (aは短いア、stはストの塊)" },
        { w: "age", j: "年齢、年齢・時代", e: "🎂", p: "エイジ (マジックEでaをエイ、gのあとがeなのでジ)" },
        { w: "life", j: "命、生活・人生", e: "❤️", p: "ライフ (マジックE：iをアルファベット読み)" },
        { w: "death", j: "死", e: "💀", p: "デス (eaは短くエ、thは息を抜く音)" },
        { w: "peace", j: "平和", e: "🕊️", p: "ピース (eaは『イー』、最後のceは『ス』)" },
        { w: "war", j: "戦争", e: "⚔️", p: "ウォー (orの音に化ける例外的なarルール)" },
        { w: "history", j: "歴史", e: "📜", p: "ヒストリー (iは短いイ、oはあいまいに発音)" },
        { w: "people", j: "人々", e: "👥", p: "ピープル (eoで『イー』、pleで『プル』と読む特殊単語)" }



    ];

    // --- 以下、システムプログラム ---

    let current = [], next = [], idx = 0, failed = false;
    let audioCtx = null;

    // 各セットの下に表示する説明文のリスト（30セット分）
    const setDescriptions = {
        1: "基本動詞①（料理する・作る・勉強する など）",
        2: "基本動詞②（見る・住む・知っている など）",
        3: "基本動詞③（踊る・買う・出発する など）",
        4: "学校生活・教科・身の回りのもの①",
        5: "学校生活・乗り物・道具・カバン など",
        6: "食べ物・飲み物・食卓の道具など",
        7: "動物・家・建物の一部（床・壁・庭など）",
        8: "家具・自然（空・海・川）・時間（日・週）",
        9: "時間（朝・夜・明日）・頻度（いつも・よく）",
        10: "街の施設（お店・駅・病院）・基本の形容詞①",
        11: "重要形容詞②（高低・新旧・暑寒・日常の状態）",
        12: "感情・性格を表す形容詞・状態（有名・重いなど）",
        13: "味覚・状態の形容詞（美味しい・お腹が空いたなど）",
        14: "代名詞（私を・彼を）・場所・重要な前置詞①",
        15: "重要な前置詞②・副詞・接続詞（～から・一緒に・なぜなら）",
        16: "カレンダー・曜日（日～土）・季節・大きな数字",
        17: "カレンダー・1月～12月・イベント（誕生日・祭り）",
        18: "体・健康（頭・目・耳・手足・病院など）",
        19: "家族・人々（父親・母親・子ども・男性女性など）",
        20: "趣味・スポーツ・娯楽（サッカー・カメラ・楽器）",
        21: "中1後半の最重要！不規則動詞の過去形①",
        22: "不規則動詞の過去形②（～になった・見つけたなど）",
        23: "気持ち・挨拶・日常会話でよく使う動詞",
        24: "建物・場所・街の施設（城・神社・スーパーなど）",
        25: "世界の国名・地域・言語・自然（地球・森など）",
        26: "地球・自然・天候（陸・雨雪・雲・植物・葉など）",
        27: "交通・乗り物・移動を表す動詞（切符・フライトなど）",
        28: "衣服・身につけるもの（シャツ・靴・めがね・着ている）",
        29: "体調・症状・健康（熱・風邪・頭痛・薬・感じるなど）",
        30: "【総仕上げ】中1の重要語句ラストスパート！"
    };

    function playCorrectSound() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        let now = audioCtx.currentTime;
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, now); 
        osc.frequency.setValueAtTime(659.25, now + 0.08); 
        osc.frequency.setValueAtTime(783.99, now + 0.16); 
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
        osc.start(now); osc.stop(now + 0.4);
    }

    function speakText(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel(); 
            let uttr = new SpeechSynthesisUtterance(text);
            uttr.lang = 'en-US'; uttr.rate = 0.9;     
            window.speechSynthesis.speak(uttr);
        }
    }

    function speakCurrentWord() {
        if (current[idx]) speakText(current[idx].w);
        document.getElementById("in").focus();
    }

    // ボタンの幅を統一し、下に小さな説明文字を表示する改良版関数
    function createSetButtons() {
        const btnContainer = document.getElementById("set-buttons");
        const setSize = 20;
        let setIndex = 1;

        // ボタンエリアのスタイル調整（中央寄せ・縦並びのブロックを並べる）
        btnContainer.style.display = "flex";
        btnContainer.style.flexDirection = "column";
        btnContainer.style.alignItems = "center";

        for (let i = 0; i < words.length; i += setSize) {
            let chunk = words.slice(i, i + setSize);
            
            // ボタンと説明を1つにまとめる枠（ラッパー）
            let wrapper = document.createElement("div");
            wrapper.style.margin = "12px 0";
            wrapper.style.width = "85%";
            wrapper.style.textAlign = "center";

            // セットボタン（幅を100%にして統一）
            let btn = document.createElement("button");
            btn.className = "sel-btn";
            btn.style.width = "100%";
            btn.style.margin = "0";
            btn.textContent = `セット ${setIndex} (${i + 1}〜${Math.min(i + setSize, words.length)}語目)`;
            btn.onclick = (function(list) { return function() { startLevel(list); }; })(chunk);
            
            // 小さな説明文の文字
            let desc = document.createElement("div");
            desc.style.fontSize = "13px";
            desc.style.color = "#7f8c8d";
            desc.style.marginTop = "5px";
            desc.style.fontWeight = "bold";
            desc.textContent = setDescriptions[setIndex] || "重要単語セット";

            wrapper.appendChild(btn);
            wrapper.appendChild(desc);
            btnContainer.appendChild(wrapper);
            setIndex++;
        }
    }

    function startLevel(targetList) {
        current = [...targetList]; next = []; idx = 0;
        document.getElementById("select-area").style.display = "none";
        document.getElementById("game-area").style.display = "block";
        init();
    }

    function init() {
        if (idx >= current.length) { end(); return; }
        failed = false;
        document.getElementById("remain").textContent = `残り: ${current.length - idx}問`;
        document.getElementById("pic").textContent = current[idx].e;
        document.getElementById("jp").textContent = current[idx].j;
        document.getElementById("hint").textContent = "";
        document.getElementById("in").value = "";
        document.getElementById("msg").textContent = "";
        document.getElementById("in").focus();
        setTimeout(() => { speakText(current[idx].w); }, 150);
    }

    function showHint() {
        document.getElementById("hint").textContent = current[idx].p;
        document.getElementById("in").focus();
    }

    function showAnswer() {
        let msg = document.getElementById("msg");
        msg.style.color = "#34495e";
        msg.innerHTML = `正解は: <span style="font-family: monospace; letter-spacing: 2px; font-weight: bold; background: #eef2f3; padding: 2px 8px; border-radius: 4px;">${current[idx].w}</span> です`;
        if (!failed) { next.push(current[idx]); failed = true; }
        document.getElementById("in").focus();
    }

    document.getElementById("in").addEventListener("keydown", function(e) {
        if (e.key === "Enter") {
            let val = this.value.trim().toLowerCase();
            let msg = document.getElementById("msg");
            if (val === current[idx].w) {
                playCorrectSound(); speakText(current[idx].w); 
                msg.style.color = "green"; msg.textContent = "⭕ 正解！";
                setTimeout(() => { idx++; init(); }, 1200); 
            } else {
                msg.style.color = "red"; msg.textContent = "❌ ちがうよ！もう一度思い出そう";
                if (!failed) { next.push(current[idx]); failed = true; }
                this.select();
            }
        }
    });

    function end() {
        let area = document.getElementById("game-area");
        if (next.length > 0) {
            area.innerHTML = `<h2>あと ${next.length} 問！</h2><p>間違えたり正解を見た単語をもう一度解き直そう。</p><button onclick="retry()" style="padding:12px 24px; font-size:18px; cursor:pointer; background:#2ecc71; color:white; border:none; border-radius:6px; font-weight:bold;">間違えた問題に再挑戦 🔄</button>`;
        } else {
            area.innerHTML = `<h2>🏆 セットクリア！</h2><p>20語すべてを完璧に思い出せました！</p><button onclick="location.reload()" style="padding:12px 24px; font-size:18px; cursor:pointer; background:#3498db; color:white; border:none; border-radius:6px; font-weight:bold;">セット選択に戻る 🔄</button>`;
        }
    }

    window.retry = function() {
        current = [...next]; next = []; idx = 0;
        document.getElementById("game-area").innerHTML = `<div class="count" id="remain"></div><div class="img" id="pic"></div><div class="jp" id="jp"></div><div class="btn-group"><button class="hint-btn" onclick="showHint()">フォニックスのヒント</button><button class="ans-btn" onclick="showAnswer()">正解を見る 👁️</button></div><div class="hint-txt" id="hint"></div><div style="display: flex; justify-content: center; align-items: center; max-width: 90%; margin: 0 auto;"><input type="text" id="in" autocomplete="off" placeholder="英単語を打ってEnter"><button class="sound-btn" onclick="speakCurrentWord()">🔊</button></div><div class="msg" id="msg"></div>`;
        document.getElementById("in").addEventListener("keydown", function(e) {
            if (e.key === "Enter") {
                let val = this.value.trim().toLowerCase();
                let msg = document.getElementById("msg");
                if (val === current[idx].w) {
                    playCorrectSound(); speakText(current[idx].w);
                    msg.style.color = "green"; msg.textContent = "⭕ 正解！";
                    setTimeout(() => { idx++; init(); }, 1200);
                } else {
                    msg.style.color = "red"; msg.textContent = "❌ ちがうよ！もう一度思い出そう";
                    if (!failed) { next.push(current[idx]); failed = true; }
                    this.select();
                }
            }
        });
        init();
    };

    createSetButtons();
</script>
