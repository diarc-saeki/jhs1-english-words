<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中1英単語マスタータイピング — MODERN ED.</title>
    <style>
        :root { --bg: #fcfcfc; --txt: #111; --sub: #707070; --red: #e63946; --brd: #e5e5e5; }
        body { font-family: sans-serif; background: var(--bg); color: var(--txt); margin: 0; padding: 4vw; display: flex; flex-direction: column; align-items: center; letter-spacing: 0.05em; }
        .wrapper { width: 100%; max-width: 90vw; margin: 0 auto; text-align: center; }
        h1 { font-size: calc(24px + 1vw); font-weight: 300; letter-spacing: 0.15em; margin-bottom: 4vh; }
        .mode-box { display: inline-flex; gap: 30px; padding: 15px 30px; border-top: 1px solid var(--brd); border-bottom: 1px solid var(--brd); margin-bottom: 5vh; font-size: calc(13px + 0.3vw); font-weight: bold; }
        .mode-box label { cursor: pointer; display: flex; align-items: center; gap: 8px; color: var(--sub); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; width: 100%; }
        .card { background: #fff; border: 1px solid var(--brd); padding: 25px 20px; text-align: left; cursor: pointer; display: flex; flex-direction: row; align-items: center; justify-content: flex-start; gap: 20px; position: relative; overflow: hidden; min-height: 120px; box-sizing: border-box; }
        .card:hover { border-color: var(--txt); background: #fafafa; transform: translateY(-2px); transition: 0.2s; }
        .c-num { font-family: 'Impact', 'Arial Black', sans-serif; font-size: calc(50px + 1vw); color: #b0b0b0; line-height: 1; flex-shrink: 0; min-width: 90px; text-align: left; z-index: 2; }
        .c-info { display: flex; flex-direction: column; align-items: flex-start; justify-content: center; z-index: 2; width: 60%; }
        .c-ttl { font-weight: bold; font-size: calc(18px + 0.3vw); margin-bottom: 6px; text-align: left; }
        .c-dsc { font-size: calc(12px + 0.2vw); color: var(--sub); line-height: 1.4; text-align: left; }
        .c-bg { position: absolute; right: 0; top: 0; height: 100%; width: 120px; opacity: 0.4; pointer-events: none; z-index: 1; }
        .count { font-family: monospace; font-size: calc(14px + 0.2vw); color: var(--sub); margin-bottom: 2vh; }
        .img { font-size: calc(80px + 6vw); margin: 2vh 0; line-height: 1.1; }
        .jp { font-size: calc(28px + 1.5vw); font-weight: 700; margin-bottom: 4vh; }
        .btns button { background: none; border: 1px solid var(--txt); padding: 10px 20px; font-size: calc(13px + 0.2vw); font-weight: 600; cursor: pointer; margin: 0 5px; }
        .btns button:hover { background: var(--txt); color: #fff; }
        .hint-txt { color: var(--red); height: 25px; font-size: calc(14px + 0.3vw); font-weight: bold; margin-bottom: 3vh; }
        .guide { font-family: monospace; font-size: calc(30px + 2vw); letter-spacing: 0.15em; font-weight: bold; margin-bottom: 3vh; height: 60px; display: none; justify-content: center; }
        .char-t { color: var(--red); } .char-r { color: #d0d0d0; }
        .in-wrap { display: flex; justify-content: center; align-items: center; gap: 15px; width: 100%; max-width: 500px; margin: 0 auto; }
        input[type="text"] { width: 100%; padding: 12px 0; font-size: calc(28px + 1.5vw); text-align: center; border: none; border-bottom: 2px solid var(--brd); background: none; outline: none; font-family: monospace; font-weight: bold; }
        input[type="text"]:focus { border-bottom-color: var(--txt); }
        .audio-btn { background: none; border: 1px solid var(--brd); font-size: calc(18px + 0.5vw); padding: 12px; cursor: pointer; aspect-ratio: 1; }
        .audio-btn:hover { border-color: var(--txt); }
        .feedback { margin-top: 3vh; font-size: calc(18px + 0.5vw); font-weight: bold; height: 35px; }
        .sys-btn { background: var(--txt); color: #fff; border: none; padding: 15px 30px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>
<div class="wrapper" id="root">
    <div id="sel-view">
        <h1>English Vocabulary</h1>
        <div class="mode-box">
            <label><input type="radio" name="mode" value="hide" checked> ❶ 通常モード (想起)</label>
            <label><input type="radio" name="mode" value="show"> ❷ ガイドモード (赤変色)</label>
        </div>
        <div class="grid" id="btn-box"></div>
    </div>
    <div id="game-view" style="display:none;">
        <div class="count" id="rem"></div><div class="img" id="pic"></div><div class="jp" id="jp"></div>
        <div class="guide" id="g-dsp"></div>
        <div class="btns"><button onclick="getHint()">HINT</button><button id="ans-b" onclick="getAns()">ANSWER</button></div>
        <div class="hint-txt" id="hnt"></div>
        <div class="in-wrap"><input type="text" id="in" autocomplete="off" placeholder="Type..."><button class="audio-btn" onclick="sayW()">🔊</button></div>
        <div class="feedback" id="msg"></div>
    </div>
</div>
<script>
        // 目次カードの「タイトル」と「説明文」の定義（1〜30セット分）
    const meta = {
        1: { t: "基本動詞①", d: "料理する・作る・勉強する ほか" },
        2: { t: "基本動詞②", d: "見る・住む・知っている ほか" },
        3: { t: "基本動詞③", d: "踊る・買う・出発する ほか" },
        4: { t: "学校と教科", d: "学校生活・教科・身の回りのもの①" },
        5: { t: "学校と道具", d: "道具・カバン・乗り物 など" },
        6: { t: "食事と道具", d: "食べ物・飲み物・食卓の道具" },
        7: { t: "動物と家", d: "動物・家・建物の一部（床・壁）" },
        8: { t: "自然と時間", d: "家具・自然（空・海）・時間（日・週）" },
        9: { t: "時間と頻度", d: "時間（朝・夜）・頻度（いつも・よく）" },
        10: { t: "施設と状態", d: "街の施設（駅・病院）・形容詞①" },
        11: { t: "重要形容詞", d: "高低・新旧・暑寒・日常の状態" },
        12: { t: "感情と性格", d: "感情を表す形容詞・状態（有名など）" },
        13: { t: "味覚と状態", d: "味覚の形容詞（美味しい・満腹など）" },
        14: { t: "代名と場所", d: "代名詞（私を）・場所・重要な前置詞①" },
        15: { t: "前置詞・副詞", d: "前置詞②・副詞・接続詞（～から）" },
        16: { t: "曜日と季節", d: "曜日（日～土）・季節・大きな数字" },
        17: { t: "月と行事", d: "カレンダー（1～12月）・イベント" },
        18: { t: "体と健康", d: "体・健康（頭・目・耳・手足）" },
        19: { t: "家族と人々", d: "家族・人々（父母・子ども・男女）" },
        20: { t: "趣味と娯楽", d: "趣味・スポーツ（サッカー・楽器）" },
        21: { t: "不規則過去①", d: "最重要！一般動詞の過去形（変化①）" },
        22: { t: "不規則過去②", d: "一般動詞の過去形（変化②）" },
        23: { t: "気持ちと日常", d: "気持ち・挨拶・日常会話の動詞" },
        24: { t: "建物と施設", d: "建物・街の施設（城・神社・スーパー）" },
        25: { t: "世界と環境", d: "世界の国名・地域・言語・自然" },
        26: { t: "自然と天候", d: "地球・天候（陸・雨雪・雲・植物）" },
        27: { t: "交通と移動", d: "交通・乗り物・移動（切符・フライト）" },
        28: { t: "衣服と装飾", d: "衣服・身につけるもの（シャツ・靴）" },
        29: { t: "体調と医学", d: "体調・症状・健康（熱・風邪・薬）" },
        30: { t: "総仕上げ", d: "【総まとめ】中1の重要語句ラスト" }
    };

    // 北欧アート風のモノクロ抽象幾何学ライン（SVG）を割り振る関数
    function getPattern(i) {
        const p = [
            `<svg class="c-bg" viewBox="0 0 100 100"><path d="M0,30 Q25,10 50,30 T100,30 T150,30" fill="none" stroke="#bbb" stroke-width="2"/></svg>`,
            `<svg class="c-bg" viewBox="0 0 100 100"><circle cx="60" cy="50" r="25" fill="none" stroke="#bbb" stroke-width="1.5"/><line x1="10" y1="10" x2="90" y2="90" stroke="#ccc" stroke-width="1"/></svg>`,
            `<svg class="c-bg" viewBox="0 0 100 100"><path d="M10,90 L40,20 L70,90 M50,90 L75,40 L100,90" fill="none" stroke="#bbb" stroke-width="1.5"/></svg>`
        ];
        return p[(i - 1) % p.length];
    }

    let current = [], next = [], idx = 0, failed = false, audioCtx = null, isGuide = false;

    function playTone(freqs, duration) {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination); osc.type = 'sine';
        if (Array.isArray(freqs)) {
            let now = audioCtx.currentTime;
            freqs.forEach((v, i) => osc.frequency.setValueAtTime(v, now + i * 0.08));
        } else { osc.frequency.setValueAtTime(freqs, audioCtx.currentTime); }
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.start(); osc.stop(audioCtx.currentTime + duration);
    }

    function say(t) { if ('speechSynthesis' in window) { window.speechSynthesis.cancel(); let u = new SpeechSynthesisUtterance(t); u.lang = 'en-US'; u.rate = 0.9; window.speechSynthesis.speak(u); } }
    function sayW() { if (current[idx]) say(current[idx].w); document.getElementById("in").focus(); }

    function makeBtns() {
        const box = document.getElementById("btn-box"); const size = 20; let sIdx = 1; box.innerHTML = "";
        for (let i = 0; i < words.length; i += size) {
            let chunk = words.slice(i, i + size);
            let m = meta[sIdx] || { t: "単語帳", d: "重要単語セット" };
            let numStr = `#${String(sIdx).padStart(2, '0')}`;
            let b = document.createElement("button"); b.className = "card";
            b.innerHTML = `<span class="c-num">${numStr}</span><div class="c-info"><span class="c-ttl">${m.t}</span><span class="c-dsc">${m.d}</span></div>${getPattern(sIdx)}`;
            b.onclick = () => { isGuide = (document.querySelector('input[name="mode"]:checked').value === "show"); current = [...chunk]; next = []; idx = 0; document.getElementById("sel-view").style.display = "none"; document.getElementById("game-view").style.display = "block"; document.getElementById("g-dsp").style.display = isGuide ? "flex" : "none"; document.getElementById("ans-b").style.display = isGuide ? "none" : "inline-block"; play(); };
            box.appendChild(b); sIdx++;
        }
    }

    function play() {
        if (idx >= current.length) { end(); return; }
        failed = false; document.getElementById("rem").textContent = `REMAINING: ${current.length - idx}`;
        document.getElementById("pic").textContent = current[idx].e; document.getElementById("jp").textContent = current[idx].j;
        document.getElementById("hnt").textContent = ""; document.getElementById("in").value = ""; document.getElementById("msg").textContent = "";
        if (isGuide) upG(""); document.getElementById("in").focus(); setTimeout(() => { say(current[idx].w); }, 150);
    }

    function upG(s) {
        const t = current[idx].w.toLowerCase(), g = document.getElementById("g-dsp"); g.innerHTML = "";
        for (let i = 0; i < t.length; i++) {
            let span = document.createElement("span"); span.textContent = t[i];
            span.className = (i < s.length && s[i] === t[i]) ? "char-t" : "char-r"; g.appendChild(span);
        }
    }

    function getHint() { document.getElementById("hnt").textContent = current[idx].p; document.getElementById("in").focus(); }
    function getAns() { let msg = document.getElementById("msg"); msg.style.color = "var(--txt)"; msg.innerHTML = `正解: <span style="font-family:monospace; background:#f0f0f0; padding:2px 8px;">${current[idx].w}</span>`; if (!failed) { next.push(current[idx]); failed = true; } document.getElementById("in").focus(); }

    document.getElementById("in").addEventListener("input", function() {
        if (!isGuide) return;
        let v = this.value.toLowerCase(), t = current[idx].w.toLowerCase();
        if (t.startsWith(v)) { if (v.length > 0) playTone(880, 0.04); upG(v); } 
        else { this.value = v.substring(0, v.length - 1); upG(this.value); }
    });

    document.getElementById("in").addEventListener("keydown", function(e) {
        if (e.key === "Enter") {
            let v = this.value.trim().toLowerCase(), m = document.getElementById("msg");
            if (v === current[idx].w.toLowerCase()) {
                playTone([523.25, 659.25, 783.99], 0.3); say(current[idx].w); m.style.color = "green"; m.textContent = "⭕ 正解！"; setTimeout(() => { idx++; play(); }, 1200); 
            } else if (!isGuide) {
                m.style.color = "var(--red)"; m.textContent = "❌ もう一度思い出そう"; if (!failed) { next.push(current[idx]); failed = true; } this.select();
            }
        }
    });

    function end() {
        let area = document.getElementById("game-view");
        if (next.length > 0) { area.innerHTML = `<h2>未達成: ${next.length}問</h2><button class="sys-btn" onclick="retry()">RETRY 🔄</button>`; } 
        else { area.innerHTML = `<h2>🏆 CLEAR</h2><button class="sys-btn" onclick="location.reload()">BACK 🔄</button>`; }
    }

    window.retry = function() {
        current = [...next]; next = []; idx = 0;
        document.getElementById("game-view").innerHTML = `<div class="count" id="rem"></div><div class="img" id="pic"></div><div class="jp" id="jp"></div><div class="guide" id="g-dsp"></div><div class="btns"><button onclick="getHint()">HINT</button><button id="ans-b" onclick="getAns()">ANSWER</button></div><div class="hint-txt" id="hnt"></div><div class="in-wrap"><input type="text" id="in" autocomplete="off" placeholder="Type..."><button class="audio-btn" onclick="sayW()">🔊</button></div><div class="feedback" id="msg"></div>`;
        document.getElementById("in").addEventListener("input", function() { if (!isGuide) return; let v = this.value.toLowerCase(), t = current[idx].w.toLowerCase(); if (t.startsWith(v)) { if (v.length > 0) playTone(880, 0.04); upG(v); } else { this.value = v.substring(0, v.length - 1); upG(this.value); } });
        document.getElementById("in").addEventListener("keydown", function(e) { if (e.key === "Enter") { let v = this.value.trim().toLowerCase(), m = document.getElementById("msg"); if (v === current[idx].w.toLowerCase()) { playTone([523.25, 659.25, 783.99], 0.3); say(current[idx].w); m.style.color = "green"; m.textContent = "⭕ 正解！"; setTimeout(() => { idx++; play(); }, 1200); } else if (!isGuide) { m.style.color = "var(--red)"; m.textContent = "❌ もう一度思い出そう"; if (!failed) { next.push(current[idx]); failed = true; } this.select(); } } });
        document.getElementById("g-dsp").style.display = isGuide ? "flex" : "none"; document.getElementById("ans-b").style.display = isGuide ? "none" : "inline-block"; play();
    };

    // --- 最初の40語を内蔵してプログラムを締めくくります ---
    const words = [
        { w: "cook", j: "料理する", e: "🍳", p: "クック (ooは『ウ』と短く引く音)" },
        { w: "make", j: "作る", e: "🛠️", p: "メィク (マジックE：最後のeは読まずaをアルファベット読み)" },
        { w: "take", j: "連れていく・撮る", e: "📸", p: "ティク (マジックE：最後のeは読まずaをアルファベット読み)" },
        { w: "think", j: "考える", e: "🤔", p: "スィンク (thは前歯で舌をはさむ音、inkの塊に注目)" },
        { w: "clean", j: "掃除する・きれいな", e: "🧹", p: "クリーン (eaは『イー』と長く伸ばすルール)" },
        { w: "hope", j: "望む", e: "✨", p: "ホゥプ (マジックE：最後のeは読まずoをアルファベット読み)" },
        { w: "study", j: "勉強する", e: "✏️", p: "スタディ (yは『イー』と読む。中1の大事な動詞)" },
        { w: "speak", j: "話す", e: "🗣️", p: "スピーク (eaは『イー』と長く伸ばすルール)" },
        { w: "write", j: "書く", e: "📝", p: "ライト (最初のwは読まない。マジックEでiをアイ)" },
        { w: "wash", j: "洗う", e: "🧼", p: "ウォッシュ (shは『シュ』と発音する2文字子音)" },
        { w: "where", j: "どこに", e: "📍", p: "ウェア (whで『ウ』、場所をたずねる大事な単語)" },
        { w: "when", j: "いつ", e: "📅", p: "ウェン (whで『ウ』、時間をたずねる大事な単語)" },
        { w: "who", j: "だれ", e: "👤", p: "フー (whだけど『フ』と読む例外的な単語)" },
        { w: "why", j: "なぜ", e: "❓", p: "ワイ (whで『ウ』、yをアルファベット読みでアイ)" },
        { w: "how", j: "どうやって", e: "💡", p: "ハウ (owは『アウ』と化けるルール)" },
        { w: "swim", j: "泳ぐ", e: "🏊", p: "スウィム (sとw的音綺麗に繋がる)" },
        { w: "run", j: "走る", e: "🏃", p: "ラン (uは短く『ア』と発音する)" },
        { w: "walk", j: "歩く", e: "🚶", p: "ウォーク (lは発音しない黙字ルール)" },
        { w: "play", j: "（スポーツや楽器を）する", e: "🎸", p: "プレイ (ayは『エイ』と読むセット)" },
        { w: "read", j: "読む", e: "📖", p: "リード (eaは『イー』と長く伸ばす)" },
        { w: "look", j: "見る", e: "👀", p: "ルック (ooは『ウ』と短く引く音)" },
        { w: "see", j: "見える・会う", e: "👁️", p: "シー (eeは『イー』と長く伸ばす)" },
        { w: "hear", j: "聞こえる", e: "👂", p: "ヒア (earで『イア』と読む塊)" },
        { w: "listen", j: "聴く", e: "🎧", p: "リッスン (tは発音しない黙字ルール)" },
        { w: "watch", j: "じっと見る", e: "⌚", p: "ウォッチ (tchで『ッチ』と発音する塊)" },
        { w: "open", j: "開ける", e: "🔓", p: "オープン (oをアルファベット読みでオゥ)" },
        { w: "close", j: "閉める", e: "🔒", p: "クロウズ (マジックEでoをオゥと読む。sは濁る)" },
        { w: "live", j: "住んでいる", e: "🏠", p: "リヴ (iは短く『イ』。例外的にマジックEにならない)" },
        { w: "love", j: "愛する・大好き", e: "❤️", p: "ラヴ (oだけど『ア』に近い音。例外マジックE)" },
        { w: "like", j: "好む・好き", e: "👍", p: "ライク (マジックE：iをアルファベット読みでアイ)" },
        { w: "want", j: "欲しい", e: "🎁", p: "ウォント (aだけど『オ』に近い音になる)" },
        { w: "have", j: "持っている", e: "👜", p: "ハヴ (例外的にマジックEにならずaを短く発音)" },
        { w: "know", j: "知っている", e: "🧠", p: "ノウ (最初のkは読まない。owは『オゥ』)" },
        { w: "help", j: "手伝う", e: "🤝", p: "ヘルプ (eは短い『エ』の音)" },
        { w: "meet", j: "会う", e: "🤝", p: "ミート (eeは『イー』と長く伸ばす)" },
        { w: "come", j: "来る", e: "🏃", p: "カム (oだけど『ア』と読む。例外マジックE)" },
        { w: "go", j: "行く", e: "🚶", p: "ゴゥ (oをアルファベット読みでオゥ)" },
        { w: "eat", j: "食べる", e: "🍽️", p: "イート (eaは『イー』と長く伸ばす)" },
        { w: "drink", j: "飲む", e: "🥤", p: "ドリンク (inkは『インク』の塊ルール)" },
        { w: "sing", j: "歌う", e: "🎤", p: "シング (ingは『イング』の塊ルール)" },
                // --- ここからセット3（41〜60語目） ---
        { w: "dance", j: "踊る", e: "💃", p: "ダンス (最後のceは『ス』と読む)" },
        { w: "smile", j: "微笑む", e: "😊", p: "スマイル (マジックEでiをアイと読む)" },
        { w: "use", j: "使う", e: "📱", p: "ユーズ (マジックEでuをユーと読む。sは濁る)" },
        { w: "buy", j: "買う", e: "🛍️", p: "バイ (uyで『アイ』と読む珍しい単語)" },
        { w: "sell", j: "売る", e: "🏪", p: "セル (eは短い『エ』の音)" },
        { w: "bring", j: "持ってくる", e: "📦", p: "ブリング (ingは『イング』の塊ルール)" },
